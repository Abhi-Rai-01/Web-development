<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landkit</title>
    <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style type="text/css">
        body{
            font-family: arial;
        }
        header{
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            padding: 30px;
        }
        header span{
            margin-right: 40px;
            color: grey;
        }
        .brand{
            font-size: 25px;
            font-weight: bold;
            color: rgb(0, 106, 255);
        }
        .buynow{
            background-color: rgb(0, 106, 255);
            color: white;
            padding: 10px;
            border-radius: 5px;
        }
        .menu{
            padding: 10px;
        }

        section{
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        main{
            margin-left: 100px;
            width: 450px;
        }
        .welcome{
            font-size: 45px;
        }
        .intro{
            margin-top: 50px;
        }
        .intro div{
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .midIntro{
            line-height: 25px;
            font-size: 20px;
            color: gray;
        }
        .introButton{
            background-color: rgb(0, 106, 255);
            color: white;
            padding: 10px;
            border-radius: 5px;
            margin-right: 20px;
        }
        .introButtons{
            padding-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">
            Landkit.
        </div>

        <div class="menu">
            <span>Landings</span>
            <span>Pages</span>
            <span>Account</span>
            <span>Documentation</span>
        </div>

        <div class="buynow">
            Buy now
        </div>
    </header>

    <section>
        <main>
            <div class="intro">    
                <div class="welcome">
                    Welcome to <span style="color: rgb(0, 106, 255);">Landkit</span>. Develop anything.
                </div>
                <div class="midIntro">
                    Build a beautiful, modern website with flexible Bootstrap components build from scratch.
                </div>
                <div class="introButtons">
                    <span class="introButton">View all pages <span class="bi bi-arrow-right-short"></span></span>
                    <span class="introButton" style="background-color: lightgrey; color: rgb(0, 106, 255);">Documentation</span>
                </div>
            </div>
        </main>
        <img src="public/images/threepeople.jpg" alt="Image of three people" height="450" width="600" title="Landkit" style="margin-top: 25px;">
    </section>
    
</body>
</html>
