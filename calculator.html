<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.css">
</head>

<body class="container-fluid text-center">
    <div class="w-25">
        <h1>Calculator</h1>
        <div class="d-block">
            <input type="text" alue="abhi" id="display" disabled>
        </div>
        <div class="mt-1 btn-group-vertical ms-2">
            <div class="btn-group">
                <button onclick="appendNumber('C')" class="btn btn-dark text-danger">C</button>
                <button onclick="appendNumber('.')" class="btn btn-dark text-success">.</button>
                <button onclick="appendNumber('%')" class="btn btn-dark text-success">%</button>
                <button onclick="appendNumber('/')" class="btn btn-dark text-success">/</button>
            </div>
            <div class="btn-group btn-group-lg">
                <button onclick="appendNumber('7')" class="btn btn-dark">7</button>
                <button onclick="appendNumber('8')" class="btn btn-dark">8</button>
                <button onclick="appendNumber('9')" class="btn btn-dark">9</button>
                <button onclick="appendNumber('*')" class="btn btn-dark text-success">*</button>
            </div>
            <div class="btn-group">
                <button onclick="appendNumber('4')" class="btn btn-dark">4</button>
                <button onclick="appendNumber('5')" class="btn btn-dark">5</button>
                <button onclick="appendNumber('6')" class="btn btn-dark">6</button>
                <button onclick="appendNumber('-')" class="btn btn-dark text-success">-</button>
            </div>
            <div class="btn-group">
                <button onclick="appendNumber('1')" class="btn btn-dark">1</button>
                <button onclick="appendNumber('2')" class="btn btn-dark">2</button>
                <button onclick="appendNumber('3')" class="btn btn-dark">3</button>
                <button onclick="appendNumber('+')" class="btn btn-dark text-success">+</button>
            </div>
            <div class="btn-group">
                <button onclick="appendNumber('(')" class="btn btn-dark">(</button>
                <button onclick="appendNumber('0')" class="btn btn-dark">0</button>
                <button onclick="appendNumber(')')" class="btn btn-dark">)</button>
                <button onclick="calculate()" class="btn btn-dark text-primary">=</button>
            </div>
        </div>
    </div>


    <script type="text/javascript">
        const display = document.getElementById("display");
        function clearDisplay(){
            display.value = "";
        }

        function appendNumber(char) {
            if (char === "=") {
                calculate();
                return;
            }
            if(char === "C"){
                clearDisplay();
                return;
            }

            display.value += char;
        }

        function calculate() {
            try {
                display.value = eval(display.value); // ideally replace eval later
            } catch (e) {
                display.value = "Error";
            }
        }

    </script>
</body>

</html>
