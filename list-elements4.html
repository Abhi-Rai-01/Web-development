<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        .choice{
            display: grid;
            grid-template-columns: 6fr 6fr;
        }
        .choice li{
            padding-top: 10px;
        }

        .option{
            columns: 2;
        }
        .option li{
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <ol>
        <li>
            Which of the following is not a oops language?
            <ol type="a" class="choice">
                <li>C</li>
                <li>C++</li>
                <li>Java</li>
                <li>Javascript</li>
            </ol>
        </li>
        <hr>
        <li>
            Which of the following is not a oops language?
            <ol type="a" class="option">
                <li>C</li>
                <li>C++</li>
                <li>Java</li>
                <li>Javascript</li>
            </ol>
        </li>
    </ol>
</body>
</html>
