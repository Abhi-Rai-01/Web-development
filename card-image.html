<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="node_modules/bootstrap-icons/font/bootstrap-icons.css">
    <style type="text/css">
        section{
            font-family: Arial, Helvetica, sans-serif;
        }
        main{
            display: flex;
            grid-template-columns: 4fr 4fr 4fr;

            column-gap: 10px;
        }
        .womenCard{
            background-image: url(public/images/women.jpg);
            background-size: 100% 100%;
            height: 400px;
            width: 400px;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            opacity: 1.0;
        }
        .womenCard:hover{
            opacity: 0.8;
        }
        .menCard:hover{
            opacity: 0.8;
        }
        .kidsCard:hover{
            opacity: 0.8;
        }

        .menCard{
            background-image: url(public/images/men.jpg);
            background-size: 100% 100%;
            height: 400px;
            width: 400px;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .kidsCard{
            background-image: url(public/images/kids.jpg);
            background-size: 100% 100%;
            height: 400px;
            width: 400px;
            
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .cardHeader{
            font-size: 40px;
            font-weight: bolder;
            color: wheat;
            text-shadow: 1px 1px 2px black;
        }
        .cardFooter{
            margin-top: 100px;
            background-color: white;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <section>
        <main>
            <div class="womenCard">
                <div class="cardHeader">
                    Women
                </div>
                <div class="cardFooter">
                    <span>Shop Women <span class="bi bi-arrow-right"></span></span>
                </div>
            </div>
            <div class="menCard">
                <div class="cardHeader">
                    Men
                </div>
                <div class="cardFooter">
                    <span>Shop Men <span class="bi bi-arrow-right"></span></span>
                </div>
            </div>
            <div class="kidsCard">
                <div class="cardHeader">
                    Kids
                </div>
                <div class="cardFooter">
                    <span>Shop kids <span class="bi bi-arrow-right"></span></span>
                </div>
            </div>
        </main>
    </section>
</body>
</html>
